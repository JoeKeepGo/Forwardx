name: Pocket ID Docker Image

on:
  workflow_call:
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/joekeepgo/forwardx

permissions:
  contents: read
  actions: read
  packages: write

concurrency:
  group: forwardx-docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'JoeKeepGo/Forwardx' && github.ref == 'refs/heads/pocket-id-oidc'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.package.outputs.version }}
      image_tag: ${{ steps.package.outputs.image_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require successful authentication CI for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh run list --repo "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" \
            --workflow oidc-auth.yml --limit 20 --json status,conclusion \
            | jq -e 'any(.[]; .status == "completed" and .conclusion == "success")'

      - name: Read package version
        id: package
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "image_tag=oidc-${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            node_arch: x64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            node_arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.title=ForwardX
            org.opencontainers.image.description=ForwardX panel with Pocket ID OIDC login
            org.opencontainers.image.source=https://github.com/JoeKeepGo/Forwardx
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.forwardx.version=${{ needs.prepare.outputs.version }}
          build-args: |
            FORWARDX_VERSION=${{ needs.prepare.outputs.version }}
          cache-from: type=gha,scope=forwardx-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=forwardx-${{ matrix.arch }}

      - name: Verify native runtime
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          EXPECTED_NODE_ARCH: ${{ matrix.node_arch }}
          PLATFORM: ${{ matrix.platform }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          docker pull "${IMAGE_NAME}@${DIGEST}"
          docker run --rm \
            --platform "${PLATFORM}" \
            --entrypoint node \
            -e "EXPECTED_NODE_ARCH=${EXPECTED_NODE_ARCH}" \
            -e "EXPECTED_VERSION=${VERSION}" \
            "${IMAGE_NAME}@${DIGEST}" \
            -e '
              const fs = require("node:fs");
              if (!fs.readFileSync("dist/index.js", "utf8").includes("/api/auth/oidc/callback")) {
                throw new Error("OIDC callback missing from runtime bundle");
              }
              const Database = require("better-sqlite3");
              const db = new Database(":memory:");
              const value = db.prepare("select 1 as value").pluck().get();
              db.close();
              if (value !== 1) throw new Error("SQLite runtime check failed");
              if (process.arch !== process.env.EXPECTED_NODE_ARCH) {
                throw new Error(`Expected ${process.env.EXPECTED_NODE_ARCH}, got ${process.arch}`);
              }
              if (process.env.FORWARDX_IMAGE_VERSION !== process.env.EXPECTED_VERSION) {
                throw new Error(`Expected version ${process.env.EXPECTED_VERSION}, got ${process.env.FORWARDX_IMAGE_VERSION}`);
              }
            '

      - name: Verify panel startup and OIDC callback
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          container=$(docker run --detach --rm --platform "$PLATFORM" \
            -e JWT_SECRET=isolated-oidc-image-smoke-test-secret \
            -p 127.0.0.1:13000:3000 "${IMAGE_NAME}@${DIGEST}")
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          curl --fail --silent --show-error --retry 15 --retry-delay 2 \
            --retry-all-errors --retry-max-time 90 --max-time 5 \
            http://127.0.0.1:13000/api/database-health \
            | jq -e 'has("state")'
          curl --fail --silent --show-error --max-time 10 \
            http://127.0.0.1:13000/ --output "$RUNNER_TEMP/panel.html"
          test -s "$RUNNER_TEMP/panel.html"
          callback_status=$(curl --silent --show-error --max-time 10 \
            --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:13000/api/auth/oidc/callback)
          test "$callback_status" = 303

      - name: Export digest
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: forwardx-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs:
      - prepare
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          pattern: forwardx-digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Create and verify multi-platform image
        shell: bash
        env:
          IMAGE_TAG: ${{ needs.prepare.outputs.image_tag }}
        run: |
          set -euo pipefail
          mapfile -t digest_files < <(find "${RUNNER_TEMP}/digests" -maxdepth 1 -type f | sort)
          if [ "${#digest_files[@]}" -ne 2 ]; then
            echo "::error::Expected 2 platform digests, found ${#digest_files[@]}"
            exit 1
          fi

          sources=()
          for digest_file in "${digest_files[@]}"; do
            sources+=("${IMAGE_NAME}@sha256:$(basename "${digest_file}")")
          done

          docker buildx imagetools create \
            -t "${IMAGE_NAME}:${IMAGE_TAG}" \
            -t "${IMAGE_NAME}:oidc" \
            "${sources[@]}"

          manifest_json="$(docker buildx imagetools inspect "${IMAGE_NAME}:${IMAGE_TAG}" --raw)"
          echo "${manifest_json}" | jq -e '
            ([.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64")] | length) == 1
            and
            ([.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64")] | length) == 1
          '

          version_digest="$(docker buildx imagetools inspect "${IMAGE_NAME}:${IMAGE_TAG}" | awk '$1 == "Digest:" { digest=$2 } END { print digest }')"
          latest_digest="$(docker buildx imagetools inspect "${IMAGE_NAME}:oidc" | awk '$1 == "Digest:" { digest=$2 } END { print digest }')"
          test -n "${version_digest}"
          test "${version_digest}" = "${latest_digest}"
          echo "Published ${IMAGE_NAME}:${IMAGE_TAG} and oidc at ${version_digest}"
          {
            echo "### Pocket ID Docker image"
            echo "- Fixed image: ${IMAGE_NAME}:${IMAGE_TAG}"
            echo "- Channel: ${IMAGE_NAME}:oidc"
            echo "- Digest: ${version_digest}"
            echo "- Platforms: linux/amd64, linux/arm64"
          } >> "$GITHUB_STEP_SUMMARY"
