name: OIDC authentication

on:
  push:
    branches: [pocket-id-oidc]
  pull_request:
    branches: [pocket-id-oidc]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oidc-auth-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Google and OIDC login integration
        run: pnpm test:oidc-auth
      - name: Sessions, disabled users, 2FA and configuration regression
        run: >-
          node --import tsx --test
          server/accountDisableSessions.test.ts
          server/loginSessionService.test.ts
          server/session.test.ts
          server/twoFactorChallenges.test.ts
          server/authRateLimit.test.ts
          server/configAudit.test.ts
          server/supportBundle.test.ts
          client/src/i18n/language.test.ts
          client/src/i18n/runtime.test.ts
      - name: Type check
        run: pnpm exec tsc --noEmit
      - name: Build panel
        run: pnpm build
      - name: Build documentation
        run: pnpm docs:build
